name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows amd64
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests without desktop interaction
        run: python -m unittest test_app test_copy test_pdf_region.RegionGeometryTests test_ocr.OcrEngineTests

      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean '법정동PNU파일복사도구.spec'

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: filemaker-windows-amd64
          path: dist/법정동PNU파일복사도구.exe
          if-no-files-found: error
          retention-days: 30
