name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows amd64
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests and Windows selection event checks
        run: python -m unittest test_app test_copy test_copy_scaling test_workspace_index test_source_selection test_async_viewer test_pdf_pipeline test_survey_batch test_survey_workflow test_survey_ocr test_survey_gui test_ppocr_engine test_pdf_region.RegionGeometryTests test_ocr.OcrEngineTests

      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean '법정동PNU파일복사도구.spec'

      - name: Check spawned workers in built EXE
        shell: pwsh
        run: |
          python tools/make_pipeline_fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'Fixture creation failed' }
          $exe = Get-Item 'dist/법정동PNU파일복사도구_v*.exe'
          foreach ($sample in @('native', 'scanned')) {
            $report = "build/frozen-$sample.json"
            $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $PWD.Path -ArgumentList @('--pipeline-check', "build/$sample.pdf", '--output', $report) -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Frozen $sample check failed" }
            $data = Get-Content -Raw -Encoding utf8 $report | ConvertFrom-Json
            if ($data.error -or $data.region.text -notmatch '123') { throw "Frozen $sample output invalid" }
            if ($sample -eq 'scanned' -and -not $data.region.ocr) { throw 'Scanned PDF did not use OCR' }
            $data | ConvertTo-Json -Depth 3
          }

      - name: Check survey GUI and batch copy in built EXE
        shell: pwsh
        run: |
          $exe = Get-Item 'dist/법정동PNU파일복사도구_v*.exe'
          $report = 'build/survey-ui-check.json'
          $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $PWD.Path -ArgumentList @('--survey-ui-check', '--output', $report) -PassThru
          $processHandle = $process.Handle
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $report)) {
            if ($process.HasExited -or (Get-Date) -gt $deadline) { throw 'Survey GUI did not become ready' }
            Start-Sleep -Milliseconds 200
          }
          $preview = Get-Content -Raw -Encoding utf8 $report | ConvertFrom-Json
          if ($preview.error) { throw $preview.error }
          try {
            Add-Type -AssemblyName System.Drawing
            $bitmap = [System.Drawing.Bitmap]::new([int]$preview.width, [int]$preview.height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen([int]$preview.x, [int]$preview.y, 0, 0, $bitmap.Size)
            $bitmap.Save((Join-Path $PWD 'build/survey-ui.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
          } catch { Write-Host "Preview capture unavailable: $_" }
          New-Item -ItemType File -Path 'build/survey-ui-check.release' -Force | Out-Null
          if (-not $process.WaitForExit(60000)) { throw 'Survey GUI copy check timed out' }
          $result = Get-Content -Raw -Encoding utf8 $report | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 4
          if ($result.header_engine -notlike 'ppocrv5-korean-*') { throw 'PP-OCRv5 header check did not complete' }
          if ($null -ne $process.ExitCode -and $process.ExitCode -ne 0) { throw "Survey GUI copy check failed ($($process.ExitCode)): $($result.error)" }
          if ($result.phase -ne 'passed' -or $result.copies -ne 3) { throw 'Survey batch output invalid' }

      - name: Upload survey UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survey-ui-preview
          path: |
            build/survey-ui.png
            build/survey-ui-check.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: filemaker-windows-amd64
          path: dist/법정동PNU파일복사도구_v*.exe
          if-no-files-found: error
          retention-days: 30
