name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows amd64
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests and Windows selection event checks
        run: python -m unittest test_app test_copy test_source_selection test_async_viewer test_pdf_pipeline test_pdf_region.RegionGeometryTests test_ocr.OcrEngineTests

      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean '법정동PNU파일복사도구.spec'

      - name: Check spawned workers in built EXE
        shell: pwsh
        run: |
          python tools/make_pipeline_fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'Fixture creation failed' }
          $exe = Get-Item 'dist/법정동PNU파일복사도구_v*.exe'
          foreach ($sample in @('native', 'scanned')) {
            $report = "build/frozen-$sample.json"
            $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $PWD.Path -ArgumentList @('--pipeline-check', "build/$sample.pdf", '--output', $report) -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Frozen $sample check failed" }
            $data = Get-Content -Raw -Encoding utf8 $report | ConvertFrom-Json
            if ($data.error -or $data.region.text -notmatch '123') { throw "Frozen $sample output invalid" }
            if ($sample -eq 'scanned' -and -not $data.region.ocr) { throw 'Scanned PDF did not use OCR' }
            $data | ConvertTo-Json -Depth 3
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: filemaker-windows-amd64
          path: dist/법정동PNU파일복사도구_v*.exe
          if-no-files-found: error
          retention-days: 30
